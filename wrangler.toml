name = "teslanavigation"
main = ".output/server/index.mjs"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".output/public"
binding = "ASSETS"

# Cloudflare provisions this D1 database when the Worker is first deployed.
# The SQL migrations are stored in ./migrations and must be applied before
# enabling the D1-backed admin API.
[[d1_databases]]
binding = "DB"
database_name = "teslanavigation"
migrations_dir = "migrations"

[observability]
enabled = true
