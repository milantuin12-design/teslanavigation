name = "teslanavigation"
main = ".output/server/index.mjs"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".output/public"
binding = "ASSETS"

# Create the D1 database with `npx wrangler d1 create teslanavigation`, then
# paste its database_id below before deploying. Apply ./migrations first.
[[d1_databases]]
binding = "DB"
database_name = "teslanavigation"
migrations_dir = "migrations"

[observability]
enabled = true
