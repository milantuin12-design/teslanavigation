name: Deploy TeslaNavigation to Cloudflare

on:
  push:
    branches:
      - cloudflare-migratie
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teslanavigation-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migratie

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Register D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 d1 migrations apply teslanavigation --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --var "BUILD_SHA:${GITHUB_SHA}"

      - name: Verify the live Worker and D1 binding repeatedly
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://teslanavigation.milantuin12.workers.dev"

          # Check the exact deployed build and D1 binding over multiple fresh
          # requests. A single successful probe is not enough: it previously
          # allowed an intermittent/mixed-version 503 to slip through.
          for attempt in $(seq 1 12); do
            version="$(curl --retry 3 --retry-all-errors --retry-delay 1 --fail --silent --show-error "$base/__version")"
            echo "Health check $attempt: $version"
            echo "$version" | grep -Fq '"app":"TeslaNavigation"'
            echo "$version" | grep -Fq "\"build\":\"$EXPECTED_BUILD\""
            echo "$version" | grep -Fq '"d1Bound":true'

            admin_status="$(curl --retry 3 --retry-all-errors --retry-delay 1 --silent --show-error -o /tmp/admin-probe.json -w '%{http_code}' "$base/api/admin/superchargers")"
            admin_body="$(cat /tmp/admin-probe.json)"
            echo "Admin D1 check $attempt: HTTP $admin_status $admin_body"
            test "$admin_status" = "401"
            ! echo "$admin_body" | grep -Fq 'Cloudflare D1-binding DB ontbreekt'
          done

          page="$(curl --retry 3 --retry-all-errors --retry-delay 1 --fail --silent --show-error -o /dev/null -w '%{http_code}' "$base/")"
          test "$page" = "200"
          echo "Verified: all 12 live checks saw the expected build and working D1 binding."
