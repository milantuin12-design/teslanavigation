name: Deploy TeslaNavigation to Cloudflare

on:
  push:
    branches:
      - cloudflare-migratie
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teslanavigation-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migratie

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Register D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 d1 migrations apply teslanavigation --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --var "BUILD_SHA:${GITHUB_SHA}"

      - name: Verify the live Worker serves this exact commit
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://teslanavigation.milantuin12.workers.dev/__version"
          for attempt in $(seq 1 18); do
            response="$(curl --fail --silent --show-error "$url" || true)"
            echo "Live version check $attempt: $response"
            if echo "$response" | grep -Fq "$EXPECTED_BUILD"; then
              echo "Verified: live Worker serves $EXPECTED_BUILD"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Cloudflare deployment completed, but the live Worker did not report commit $EXPECTED_BUILD."
          exit 1
