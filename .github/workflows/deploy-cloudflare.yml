name: Deploy TeslaNavigation to Cloudflare # always deploy the production migration branch, never main

on:
  push:
    branches:
      - cloudflare-migratie
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teslanavigation-cloudflare-deploy-v2
  # A newer push must supersede an older build, never deploy stale app code afterward.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          # Build exactly the commit that triggered this run; never float to a newer/older branch head.
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Register D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 d1 migrations apply teslanavigation --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --var "BUILD_SHA:${GITHUB_SHA}"

      - name: Verify the live Worker and D1 binding after global propagation
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://teslanavigation.milantuin12.workers.dev"
          stable=0
          for attempt in $(seq 1 24); do
            version="$(curl --connect-timeout 5 --max-time 15 --silent --show-error "$base/__version" || true)"
            if ! echo "$version" | grep -Fq "\"build\":\"$EXPECTED_BUILD\"" ||
               ! echo "$version" | grep -Fq '"d1Bound":true'; then
              echo "Propagation check $attempt: waiting for exact build; got $version"
              stable=0
              sleep 5
              continue
            fi

            d1_status="$(curl --connect-timeout 5 --max-time 15 --silent --show-error -o /tmp/d1-probe.json -w '%{http_code}' "$base/__health/d1" || true)"
            d1_body="$(cat /tmp/d1-probe.json 2>/dev/null || true)"
            admin_d1_status="$(curl --connect-timeout 5 --max-time 15 --silent --show-error -o /tmp/admin-d1-probe.json -w '%{http_code}' "$base/__health/admin-d1" || true)"
            admin_d1_body="$(cat /tmp/admin-d1-probe.json 2>/dev/null || true)"
            admin_status="$(curl --connect-timeout 5 --max-time 15 --silent --show-error -o /tmp/admin-probe.json -w '%{http_code}' "$base/api/admin/superchargers" || true)"
            admin_body="$(cat /tmp/admin-probe.json 2>/dev/null || true)"
            session_status="$(curl --connect-timeout 5 --max-time 15 --silent --show-error -o /tmp/session-probe.json -w '%{http_code}' "$base/api/auth/me" || true)"
            session_body="$(cat /tmp/session-probe.json 2>/dev/null || true)"
            login_status="$(curl --connect-timeout 5 --max-time 15 --silent --show-error -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"email":"invalid","password":"x"}' -o /tmp/login-probe.json -w '%{http_code}' "$base/api/auth/login" || true)"
            login_body="$(cat /tmp/login-probe.json 2>/dev/null || true)"
            page="$(curl --connect-timeout 5 --max-time 15 --silent --show-error -o /dev/null -w '%{http_code}' "$base/" || true)"

            echo "Stable check $attempt: build=$EXPECTED_BUILD D1=$d1_status $d1_body admin-table=$admin_d1_status $admin_d1_body admin=$admin_status $admin_body session=$session_status login=$login_status page=$page"
            if [ "$d1_status" = "200" ] &&
               echo "$d1_body" | grep -Fq '"ok":true' &&
               [ "$admin_d1_status" = "200" ] &&
               echo "$admin_d1_body" | grep -Fq '"adminQuery":true' &&
               [ "$admin_status" = "401" ] &&
               echo "$admin_body" | grep -Fq 'Je bent niet ingelogd.' &&
               [ "$session_status" = "401" ] &&
               echo "$session_body" | grep -Fq 'Je bent niet ingelogd.' &&
               [ "$login_status" = "400" ] &&
               echo "$login_body" | grep -Fq 'Vul een geldig e-mailadres en wachtwoord in.' &&
               [ "$page" = "200" ]; then
              stable=$((stable + 1))
              echo "Consecutive complete live checks: $stable/3"
              if [ "$stable" -ge 3 ]; then
                echo "Verified: the exact deployed build passed three complete live checks after propagation."
                exit 0
              fi
            else
              stable=0
            fi
            sleep 5
          done
          echo "::error::The exact deployed Worker did not pass three consecutive complete live checks within two minutes."
          exit 1