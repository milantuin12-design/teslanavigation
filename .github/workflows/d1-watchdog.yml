name: TeslaNavigation D1 watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teslanavigation-d1-watchdog
  cancel-in-progress: false

jobs:
  monitor-and-recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check live D1 before taking action
        id: health
        shell: bash
        run: |
          set -euo pipefail
          base="https://teslanavigation.milantuin12.workers.dev"
          healthy=false
          for attempt in $(seq 1 5); do
            code="$(curl --retry 2 --retry-all-errors --retry-delay 2 --silent --show-error -o /tmp/d1.json -w '%{http_code}' "$base/__health/d1" || true)"
            body="$(cat /tmp/d1.json 2>/dev/null || true)"
            echo "Live D1 probe $attempt: HTTP $code $body"
            if [ "$code" = "200" ] && echo "$body" | grep -Fq '"ok":true'; then
              healthy=true
              break
            fi
            sleep 10
          done
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"

      - name: Checkout latest migration branch
        if: steps.health.outputs.healthy != 'true'
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migratie

      - name: Set up Node.js
        if: steps.health.outputs.healthy != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.health.outputs.healthy != 'true'
        run: npm install --no-audit --no-fund

      - name: Build production app
        if: steps.health.outputs.healthy != 'true'
        run: npm run build

      - name: Re-deploy Worker without touching D1 data
        if: steps.health.outputs.healthy != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --var "BUILD_SHA:$(git rev-parse HEAD)"

      - name: Verify recovery
        if: steps.health.outputs.healthy != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://teslanavigation.milantuin12.workers.dev"
          for attempt in $(seq 1 12); do
            code="$(curl --retry 3 --retry-all-errors --retry-delay 1 --silent --show-error -o /tmp/d1-after.json -w '%{http_code}' "$base/__health/d1")"
            body="$(cat /tmp/d1-after.json)"
            echo "Post-recovery D1 probe $attempt: HTTP $code $body"
            test "$code" = "200"
            echo "$body" | grep -Fq '"ok":true'
            sleep 2
          done
