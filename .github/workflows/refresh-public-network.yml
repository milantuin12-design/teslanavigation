name: Refresh public European Supercharger data
on:
  push:
    branches: [cloudflare-migratie]
    paths:
      - ".github/workflows/refresh-public-network.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migratie
      - name: Download current supercharge.info network data
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const response = await fetch('https://supercharge.info/service/supercharge/allSites');
            if (!response.ok) throw new Error('supercharge.info HTTP ' + response.status);
            const all = await response.json();
            if (!Array.isArray(all) || all.length < 1000) throw new Error('Unexpected source response; refusing to replace data');
            const sites = all.filter(site => site.address?.region === 'Europe' || site.address?.country === 'Turkey');
            if (sites.length < 100) throw new Error('European dataset unexpectedly small: ' + sites.length);
            const output = { source: 'supercharge.info', sourceUrl: 'https://supercharge.info/service/supercharge/allSites', exportedAt: new Date().toISOString(), sourceCount: all.length, count: sites.length, sites };
            fs.writeFileSync('src/data/supercharge-info-europe.json', JSON.stringify(output) + '\n');
            console.log('Fetched ' + all.length + ' sites; saved ' + sites.length + ' European/Turkey sites.');
            console.log('Sample:', JSON.stringify(sites.slice(0, 2)));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit refreshed network data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/supercharge-info-europe.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh public European Supercharger network data"
          git push origin cloudflare-migratie
