name: Export live Supercharger database
on:
  push:
    branches: [cloudflare-migratie]
    paths:
      - ".github/workflows/export-live-superchargers.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migratie
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export public live Supercharger rows from Supabase
        env:
          SUPABASE_URL: https://tzuylkuhldgpopdhqlre.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const rows = [];
            let start = 0;
            const pageSize = 1000;
            while (true) {
              const url = new URL('/rest/v1/superchargers', process.env.SUPABASE_URL);
              url.searchParams.set('select', '*');
              url.searchParams.set('order', 'id.asc');
              const response = await fetch(url, {
                headers: {
                  apikey: process.env.SUPABASE_KEY,
                  Authorization: 'Bearer ' + process.env.SUPABASE_KEY,
                  Range: `${start}-${start + pageSize - 1}`,
                  'Range-Unit': 'items'
                }
              });
              if (!response.ok) throw new Error(`Supabase export failed: HTTP ${response.status}: ${(await response.text()).slice(0, 500)}`);
              const page = await response.json();
              rows.push(...page);
              if (page.length < pageSize) break;
              start += pageSize;
              if (start > 50000) throw new Error('Safety stop: more than 50,000 rows');
            }
            if (!rows.length) throw new Error('Supabase returned zero rows; refusing to replace anything');
            const output = {
              exportedAt: new Date().toISOString(),
              source: 'Supabase live public API',
              count: rows.length,
              chargers: rows
            };
            fs.mkdirSync('src/data', { recursive: true });
            fs.writeFileSync('src/data/superchargers-live-export.json', JSON.stringify(output, null, 2) + '\n');
            console.log(`Exported ${rows.length} live Supercharger rows.`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit export to migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/superchargers-live-export.json
          git commit -m "Export latest live Supercharger database snapshot" || exit 0
          git push origin cloudflare-migratie
